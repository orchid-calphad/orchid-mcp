# Tests that need no local ORCHID data (the data-dependent tests skip themselves; network access fails a test).
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[test]' "pytest==9.1.1"
      - run: python -m pytest -q -p no:cacheprovider
