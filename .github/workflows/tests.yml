# Tests that need no local ORCHID data (the data-dependent tests skip themselves; network access fails a test).
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:  # a newer push cancels the superseded run of the same branch or pull request
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7  # uv is pinned to the version used for uv.lock
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --only-group dev --python 3.13
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
  tests:
    # Linux, Windows and macOS (BL-005): GitHub's hosted runners are free for public repositories.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10  # a hung test fails in minutes (a green run takes under a minute)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7  # uv is pinned to the version used for uv.lock
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --no-dev --extra test --python ${{ matrix.python-version }}
      - run: uv run --no-sync python -m pytest -q -p no:cacheprovider
