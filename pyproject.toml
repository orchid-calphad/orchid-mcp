[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "orchid-mcp"
version = "0.1.0"
description = "MCP server and static JSON API description for ORCHID CALPHAD data (literature values, phase diagrams, DFT hulls, TDB catalog) with full provenance"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Raymundo Arróyave" }]
keywords = ["CALPHAD", "MCP", "thermodynamics", "phase diagrams", "TDB"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]  # tested release; the code also runs on mcp 1.x (FastMCP)
test = ["pytest", "pyyaml"]

[project.scripts]
orchid-mcp = "orchid_mcp.server:main"

[project.urls]
Homepage = "https://orchid-project.org"
Data = "https://data.orchid-project.org"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orchid_mcp = ["py.typed"]  # PEP 561: the package is typed

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
force-exclude = true

[tool.ruff.lint]
select = ["A", "B", "C4", "D", "E", "ERA", "F", "FA", "I", "ICN", "N", "PL", "PTH", "Q", "SIM", "TC", "UP", "W"]
ignore = ["E501", "PLR0913", "PLR2004"]  # long lines and magic-value comparisons are judgment calls, not lint failures
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/orchid_mcp/server.py" = ["D205", "PLR0917", "A002", "N803"]  # MCP tool functions: parameter names, positional order and docstrings are the advertised protocol schema and descriptions, so they stay as they are

[tool.ruff.format]
quote-style = "double"
